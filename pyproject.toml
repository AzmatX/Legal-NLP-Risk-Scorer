[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-contract-intelligence"
version = "0.1.0"
description = "AI-Powered Contract Intelligence & Risk Scoring System"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  # Web & API
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.30.0",
  "python-multipart>=0.0.9",
  "python-dotenv>=1.0.0",          # Environment variables ke liye zaroori
  "pydantic>=2.8.0",
  "pydantic-settings>=2.3.0",     # Config management ke liye best practice

  # Async Tasks & Caching
  "celery>=5.4.0",
  "redis>=5.0.0",                  # Celery broker ke liye (yeh sabse important missing tha)

  # Data Processing (CUAD, Pandas, NLP base)
  "pandas>=2.2.0",
  "numpy>=1.26.0",
  "scikit-learn>=1.5.0",           # Metrics aur TF-IDF/CountVectorizer ke liye

  # OCR & Document Parsing (aapke `src/ocr` mein use ho raha hoga)
  "pdfplumber>=0.11.0",
  "pypdf>=4.2.0",
  "pytesseract>=0.3.10",           # Agar Tesseract use kar rahe ho
  "Pillow>=10.0.0",                # Image processing

  # Vector Store & Semantic Search
  "chromadb>=0.5.0",
  "faiss-cpu>=1.8.0",              # CPU version (production ke liye). GPU chahiye toh faiss-gpu.
  "langchain>=0.2.0",
  "langchain-community>=0.2.0",    # Chroma/FAISS wrappers ke liye
]

[project.optional-dependencies]
ml = [
  "torch>=2.3.0",
  "transformers>=4.44.0",
  "sentence-transformers>=2.7.0",  # Embeddings (all-MiniLM-L6-v2 etc.) ke liye
  "spacy>=3.7.0",
  "accelerate>=0.30.0",            # Transformer loading fast karne ke liye
]
dev = [
  "pytest>=8.2.0",
  "pytest-cov>=5.0.0",
  "ruff>=0.5.0",
  "httpx>=0.27.0",
  "mypy>=1.10.0",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]